name: Deploy Pipeline

on:
  push:
    branches: [develop, release, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        type: choice
        options:
          - auto
          - dev
          - staging
          - prod
        default: auto
      cloud:
        description: 'Cloud provider'
        required: false
        type: choice
        options:
          - auto
          - azure
          - aws
        default: auto

permissions:
  id-token: write
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Stage 0: Context Resolution
  # ============================================================================
  context:
    name: Resolve Context
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      cloud_input: ${{ steps.resolve.outputs.cloud_input }}
    
    steps:
      - name: Resolve environment from branch
        id: resolve
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.environment }}" != "auto" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV="prod"
          elif [ "${{ github.ref }}" == "refs/heads/release" ]; then
            ENV="staging"
          else
            ENV="dev"
          fi
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Resolved environment: $ENV"
          
          CLOUD_INPUT="${{ inputs.cloud || 'auto' }}"
          echo "cloud_input=$CLOUD_INPUT" >> $GITHUB_OUTPUT
          echo "Cloud input: $CLOUD_INPUT"

  # ============================================================================
  # Stage 0: Cloud Selection
  # ============================================================================
  decide:
    name: Decide Cloud Provider
    runs-on: ubuntu-latest
    needs: context
    outputs:
      cloud: ${{ steps.decide.outputs.cloud }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Determine cloud provider
        id: decide
        run: |
          CLOUD_INPUT="${{ needs.context.outputs.cloud_input }}"
          
          # Check if AWS is requested
          if [ "$CLOUD_INPUT" == "aws" ]; then
            echo "::error::AWS deployment is not implemented for this repo yet. Use cloud=azure or cloud=auto."
            exit 1
          fi
          
          # Check what infrastructure exists
          HAS_AZURE=false
          HAS_AWS=false
          
          if [ -d "infra/azure" ] && [ -f "infra/azure/main.bicep" ]; then
            HAS_AZURE=true
          fi
          
          if [ -d "infra/aws" ] && [ -f "infra/aws/main.tf" ]; then
            HAS_AWS=true
          fi
          
          # Determine cloud
          if [ "$CLOUD_INPUT" == "azure" ]; then
            if [ "$HAS_AZURE" != "true" ]; then
              echo "::error::Azure infrastructure not found in infra/azure/"
              exit 1
            fi
            CLOUD="azure"
          elif [ "$CLOUD_INPUT" == "auto" ]; then
            if [ "$HAS_AZURE" == "true" ] && [ "$HAS_AWS" == "true" ]; then
              echo "::error::Both Azure and AWS infrastructure found. Please specify cloud=azure or cloud=aws explicitly."
              exit 1
            elif [ "$HAS_AZURE" == "true" ]; then
              CLOUD="azure"
            elif [ "$HAS_AWS" == "true" ]; then
              echo "::error::AWS deployment is not implemented for this repo yet."
              exit 1
            else
              echo "::error::No infrastructure found in infra/azure/ or infra/aws/"
              exit 1
            fi
          else
            echo "::error::Invalid cloud input: $CLOUD_INPUT"
            exit 1
          fi
          
          echo "cloud=$CLOUD" >> $GITHUB_OUTPUT
          echo "Selected cloud: $CLOUD"

  # ============================================================================
  # Stage 1: Test
  # ============================================================================
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest
    needs: decide
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NPM_PACKAGE_TOKEN: ${{ secrets.NPM_PACKAGE_TOKEN }}

      - name: Run type checking
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Build application
        run: npm run build

  # ============================================================================
  # Stage 2: Build Container Image
  # ============================================================================
  build:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    needs: [context, test]
    outputs:
      image_ref: ${{ steps.image_ref.outputs.ref }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ needs.context.outputs.environment }}-,format=short
            type=raw,value=${{ needs.context.outputs.environment }}-latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NPM_PACKAGE_TOKEN=${{ secrets.NPM_PACKAGE_TOKEN }}

      - name: Extract single image reference
        id: image_ref
        run: |
          IMAGE_REF=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "ref=$IMAGE_REF" >> $GITHUB_OUTPUT
          echo "Image reference: $IMAGE_REF"

  # ============================================================================
  # Stage 3: Deploy to GREEN (Azure)
  # ============================================================================
  deploy_azure:
    name: Deploy to Azure (GREEN)
    runs-on: ubuntu-latest
    needs: [context, decide, build]
    if: needs.decide.outputs.cloud == 'azure'
    environment: ${{ needs.context.outputs.environment }}
    concurrency:
      group: deploy-react-${{ needs.context.outputs.environment }}
      cancel-in-progress: false
    outputs:
      green_url: ${{ steps.deploy.outputs.green_url }}
      green_id: ${{ steps.deploy.outputs.green_id }}
      blue_id: ${{ steps.deploy.outputs.blue_id }}
      active_url: ${{ steps.deploy.outputs.active_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy GREEN revision
        id: deploy
        run: |
          chmod +x scripts/ci/deploy-azure-green.sh
          ./scripts/ci/deploy-azure-green.sh
          
          # Verify outputs were written
          echo "Verifying step outputs are set:"
          echo "green_url output: $(grep '^green_url=' $GITHUB_OUTPUT | cut -d= -f2-)"
          echo "green_id output: $(grep '^green_id=' $GITHUB_OUTPUT | cut -d= -f2-)"
        env:
          ENVIRONMENT: ${{ needs.context.outputs.environment }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          AZURE_RESOURCE_GROUP_NAME: ${{ secrets.AZURE_RESOURCE_GROUP_NAME }}
          AZURE_CONTAINER_APPS_ENVIRONMENT_NAME: ${{ secrets.AZURE_CONTAINER_APPS_ENVIRONMENT_NAME }}
          AZURE_CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          AZURE_REGION: ${{ vars.AZURE_REGION }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NAME: react-app-shell

  # ============================================================================
  # Stage 4: Verify GREEN + Switch Traffic (Azure)
  # ============================================================================
  verify_switch_azure:
    name: Verify & Switch Traffic (Azure)
    runs-on: ubuntu-latest
    needs: [context, decide, deploy_azure]
    if: needs.decide.outputs.cloud == 'azure'
    environment: ${{ needs.context.outputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: IaC Security Check
        run: |
          echo "Running IaC security checks..."
          # Install checkov
          pip install checkov
          
          # Run checkov on Bicep files
          checkov -d infra/azure --framework bicep --quiet --compact
        continue-on-error: false

      - name: Health check GREEN revision
        run: |
          GREEN_URL="${{ needs.deploy_azure.outputs.green_url }}"
          echo "Health checking GREEN: $GREEN_URL"
          
          MAX_ATTEMPTS=10
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS..."
            
            if curl -f -s -m 10 "$GREEN_URL" > /dev/null; then
              echo "✅ GREEN is healthy"
              exit 0
            fi
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Waiting 10s before retry..."
              sleep 10
            fi
          done
          
          echo "::error::GREEN health check failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Smoke test GREEN revision
        run: |
          GREEN_URL="${{ needs.deploy_azure.outputs.green_url }}"
          echo "Running smoke tests against GREEN: $GREEN_URL"
          
          RESPONSE=$(curl -f -s -m 10 "$GREEN_URL")
          
          if echo "$RESPONSE" | grep -q "<html"; then
            echo "✅ HTML content found"
          else
            echo "::error::No HTML content in response"
            exit 1
          fi
          
          if echo "$RESPONSE" | grep -q "root"; then
            echo "✅ React root element found"
          else
            echo "::error::React root element not found"
            exit 1
          fi
          
          echo "✅ Smoke tests passed"

      - name: Switch traffic to GREEN
        id: switch
        run: |
          chmod +x scripts/ci/switch-azure-bluegreen.sh
          scripts/ci/switch-azure-bluegreen.sh
        env:
          AZURE_RESOURCE_GROUP_NAME: ${{ secrets.AZURE_RESOURCE_GROUP_NAME }}
          AZURE_CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          GREEN_ID: ${{ needs.deploy_azure.outputs.green_id }}
          BLUE_ID: ${{ needs.deploy_azure.outputs.blue_id }}

      - name: Rollback on failure
        if: failure()
        run: |
          echo "::error::Deployment verification failed. Rolling back to BLUE..."
          
          BLUE_ID="${{ needs.deploy_azure.outputs.blue_id }}"
          
          if [ -z "$BLUE_ID" ]; then
            echo "::warning::No BLUE revision to rollback to (first deployment)"
            exit 0
          fi
          
          chmod +x scripts/ci/rollback-azure-bluegreen.sh
          scripts/ci/rollback-azure-bluegreen.sh
        env:
          AZURE_RESOURCE_GROUP_NAME: ${{ secrets.AZURE_RESOURCE_GROUP_NAME }}
          AZURE_CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          BLUE_ID: ${{ needs.deploy_azure.outputs.blue_id }}
          GREEN_ID: ${{ needs.deploy_azure.outputs.green_id }}
