name: CI/CD Pipeline

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      deploy_enabled:
        description: 'Deploy to Azure'
        required: true
        type: boolean
        default: false
      revision_label:
        description: 'Revision label (blue/green)'
        required: false
        type: choice
        options:
          - blue
          - green
          - active
        default: blue
      initial_traffic_weight:
        description: 'Initial traffic weight for new revision (0-100)'
        required: false
        type: number
        default: 0
      enable_traffic_switch:
        description: 'Switch 100% traffic to new revision after verification'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Stage 1: Test
  # ============================================================================
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Print environment diagnostics
        run: |
          echo "Node version: $(node -v)"
          echo "npm version: $(npm -v)"
          echo "npm config:"
          npm config list
          echo "Lockfile exists: $(test -f package-lock.json && echo 'yes' || echo 'no')"

      - name: Install dependencies
        run: npm ci
        env:
          NPM_PACKAGE_TOKEN: ${{ secrets.NPM_PACKAGE_TOKEN }}

      - name: Run type checking
        run: npm run typecheck

      - name: Run linting
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ============================================================================
  # Stage 2: Build & Push Container Image
  # ============================================================================
  build:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    needs: test
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_enabled == true)
    outputs:
      image_tag: ${{ steps.image_ref.outputs.tag }}
      image_digest: ${{ steps.build.outputs.digest }}
      environment: ${{ steps.env.outputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Print environment diagnostics
        run: |
          echo "Node version: $(node -v)"
          echo "npm version: $(npm -v)"
          echo "Environment: ${{ steps.env.outputs.environment }}"

      - name: Print build diagnostics
        run: |
          echo "Node version: $(node -v)"
          echo "npm version: $(npm -v)"
          echo "Environment: ${{ steps.env.outputs.environment }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ steps.env.outputs.environment }}-,format=short
            type=raw,value=${{ steps.env.outputs.environment }}-latest
            type=raw,value=${{ steps.env.outputs.environment }}-${{ github.run_number }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NPM_PACKAGE_TOKEN=${{ secrets.NPM_PACKAGE_TOKEN }}

      - name: Extract single image reference
        id: image_ref
        run: |
          # Get the first tag (SHA-based) as the primary image reference
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Using image: $IMAGE_TAG"

  # ============================================================================
  # Stage 3: Deploy to Azure
  # ============================================================================
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ needs.build.outputs.environment }}
    outputs:
      active_url: ${{ steps.deploy.outputs.activeUrl }}
      revision_url: ${{ steps.deploy.outputs.revisionUrl }}
      revision_name: ${{ steps.deploy.outputs.latestRevisionName }}
      container_app_name: ${{ steps.deploy.outputs.containerAppName }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Determine revision label
        id: revision_label
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "label=${{ inputs.revision_label }}" >> $GITHUB_OUTPUT
          else
            # Auto-determine based on current active revision
            CURRENT_LABEL=$(az containerapp revision list \
              --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP_NAME }} \
              --query "[?properties.trafficWeight>0].properties.template.revisionSuffix | [0]" \
              --output tsv 2>/dev/null || echo "")
            
            if [[ "$CURRENT_LABEL" == *"blue"* ]]; then
              echo "label=green" >> $GITHUB_OUTPUT
            else
              echo "label=blue" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Generate revision suffix
        id: revision
        run: |
          REVISION_SUFFIX="${{ steps.revision_label.outputs.label }}-$(date +%Y%m%d-%H%M%S)"
          echo "suffix=$REVISION_SUFFIX" >> $GITHUB_OUTPUT

      - name: Determine traffic weight
        id: traffic
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "weight=${{ inputs.initial_traffic_weight }}" >> $GITHUB_OUTPUT
          else
            # Auto-deploy with 0% traffic for testing
            echo "weight=0" >> $GITHUB_OUTPUT
          fi

      - name: Debug environment variables
        run: |
          echo "Environment: ${{ needs.build.outputs.environment }}"
          echo "AZURE_RESOURCE_GROUP_NAME: ${{ secrets.AZURE_RESOURCE_GROUP_NAME }}"
          echo "AZURE_CONTAINER_APPS_ENVIRONMENT_NAME: ${{ secrets.AZURE_CONTAINER_APPS_ENVIRONMENT_NAME }}"
          echo "AZURE_CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}"
          echo "AZURE_REGION: ${{ vars.AZURE_REGION }}"
          echo "Image reference: ${{ needs.build.outputs.image_tag }}"
          echo "Revision suffix: ${{ steps.revision.outputs.suffix }}"

      - name: Deploy Bicep template
        id: deploy
        uses: azure/arm-deploy@v1
        with:
          scope: resourcegroup
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP_NAME }}
          template: ./infra/azure/main.bicep
          parameters: >
            environmentName=${{ secrets.AZURE_CONTAINER_APPS_ENVIRONMENT_NAME }}
            containerAppName=${{ secrets.AZURE_CONTAINER_APP_NAME }}
            imageReference=${{ needs.build.outputs.image_tag }}
            revisionSuffix=${{ steps.revision.outputs.suffix }}
            trafficWeight=${{ steps.traffic.outputs.weight }}
            revisionLabel=${{ steps.revision_label.outputs.label }}
            isFirstDeployment=true
            registryUsername=${{ github.actor }}
            registryPassword=${{ secrets.NPM_PACKAGE_TOKEN }}
            location=${{ vars.AZURE_REGION }}
            environment=${{ needs.build.outputs.environment }}
          failOnStdErr: false

      - name: Output deployment info
        run: |
          echo "### 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.build.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Revision Label:** ${{ steps.revision_label.outputs.label }}" >> $GITHUB_STEP_SUMMARY
          echo "**Revision Name:** ${{ steps.deploy.outputs.latestRevisionName }}" >> $GITHUB_STEP_SUMMARY
          echo "**Initial Traffic:** ${{ steps.traffic.outputs.weight }}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Active URL:** ${{ steps.deploy.outputs.activeUrl }}" >> $GITHUB_STEP_SUMMARY
          echo "**Revision URL:** ${{ steps.deploy.outputs.revisionUrl }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stage 4: Verify Deployment
  # ============================================================================
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [build, deploy]
    
    steps:
      - name: Wait for deployment to stabilize
        run: |
          echo "Waiting 30s for deployment to stabilize..."
          sleep 30

      - name: Health check - Revision URL
        id: health_check
        run: |
          REVISION_URL="${{ needs.deploy.outputs.revision_url }}"
          echo "Testing revision URL: $REVISION_URL"
          
          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$REVISION_URL" || echo "000")
            echo "Attempt $i/10: HTTP $HTTP_CODE"
            
            if [ "$HTTP_CODE" == "200" ]; then
              echo "✅ Revision is healthy and reachable"
              echo "healthy=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            
            if [ $i -lt 10 ]; then
              echo "Retrying in 10s..."
              sleep 10
            fi
          done
          
          echo "❌ Health check failed after 10 attempts"
          echo "healthy=false" >> $GITHUB_OUTPUT
          exit 1

      - name: Basic smoke tests
        if: steps.health_check.outputs.healthy == 'true'
        run: |
          REVISION_URL="${{ needs.deploy.outputs.revision_url }}"
          
          echo "Running smoke tests..."
          
          # Test health endpoint
          if curl -f -s "$REVISION_URL/health" | grep -q "healthy"; then
            echo "✅ Health endpoint working"
          else
            echo "❌ Health endpoint failed"
            exit 1
          fi
          
          # Test main page returns HTML
          if curl -f -s "$REVISION_URL" | grep -q "<html"; then
            echo "✅ Main page returns HTML"
          else
            echo "❌ Main page failed"
            exit 1
          fi
          
          echo "✅ All smoke tests passed"

      - name: Verification summary
        run: |
          echo "### ✅ Verification Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Health Status:** Healthy" >> $GITHUB_STEP_SUMMARY
          echo "**Smoke Tests:** Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Revision URL:** ${{ needs.deploy.outputs.revision_url }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stage 5: Traffic Switch (Blue/Green)
  # ============================================================================
  traffic_switch:
    name: Switch Traffic to New Revision
    runs-on: ubuntu-latest
    needs: [build, deploy, verify]
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.enable_traffic_switch == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment:
      name: ${{ needs.build.outputs.environment }}-traffic-switch
      url: ${{ needs.deploy.outputs.active_url }}
    
    steps:
      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get current traffic distribution
        id: current_traffic
        run: |
          az containerapp ingress traffic show \
            --name ${{ needs.deploy.outputs.container_app_name }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP_NAME }} \
            --output json > current_traffic.json
          
          cat current_traffic.json
          echo "Current traffic distribution retrieved"

      - name: Switch 100% traffic to new revision
        id: switch
        run: |
          REVISION_NAME="${{ needs.deploy.outputs.revision_name }}"
          
          echo "Switching 100% traffic to: $REVISION_NAME"
          
          az containerapp ingress traffic set \
            --name ${{ needs.deploy.outputs.container_app_name }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP_NAME }} \
            --revision-weight $REVISION_NAME=100
          
          echo "✅ Traffic switch complete"

      - name: Verify traffic switch
        run: |
          echo "Waiting 10s for traffic switch to propagate..."
          sleep 10
          
          ACTIVE_URL="${{ needs.deploy.outputs.active_url }}"
          
          for i in {1..5}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$ACTIVE_URL" || echo "000")
            echo "Verification attempt $i/5: HTTP $HTTP_CODE"
            
            if [ "$HTTP_CODE" == "200" ]; then
              echo "✅ Active URL is healthy after traffic switch"
              exit 0
            fi
            
            if [ $i -lt 5 ]; then
              sleep 5
            fi
          done
          
          echo "⚠️ Warning: Could not verify active URL health"
          exit 1

      - name: Traffic switch summary
        run: |
          echo "### 🔄 Traffic Switch Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**New Active Revision:** ${{ needs.deploy.outputs.revision_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Traffic Weight:** 100%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Active URL:** ${{ needs.deploy.outputs.active_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 Deployment fully complete and serving production traffic!"
