name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      revision_label:
        description: 'Revision label (blue/green)'
        required: true
        type: choice
        options:
          - blue
          - green
          - active
      traffic_weight:
        description: 'Traffic weight for this revision (0-100)'
        required: true
        type: number
        default: 100

permissions:
  id-token: write
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ inputs.environment }}-,format=short
            type=raw,value=${{ inputs.environment }}-latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NPM_PACKAGE_TOKEN=${{ secrets.NPM_PACKAGE_TOKEN }}

  deploy-infrastructure:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate revision suffix
        id: revision
        run: |
          REVISION_SUFFIX="${{ inputs.revision_label }}-$(date +%Y%m%d-%H%M%S)"
          echo "suffix=$REVISION_SUFFIX" >> $GITHUB_OUTPUT

      - name: Deploy Bicep template
        id: deploy
        uses: azure/arm-deploy@v1
        with:
          scope: resourcegroup
          resourceGroupName: ${{ secrets.AZURE_RESOURCE_GROUP_NAME }}
          template: ./infra/azure/main.bicep
          parameters: >
            environmentName=${{ secrets.AZURE_CONTAINER_APPS_ENVIRONMENT_NAME }}
            containerAppName=${{ secrets.AZURE_CONTAINER_APP_NAME }}
            imageReference=${{ needs.build-and-push.outputs.image_tag }}
            revisionSuffix=${{ steps.revision.outputs.suffix }}
            trafficWeight=${{ inputs.traffic_weight }}
            revisionLabel=${{ inputs.revision_label }}
            location=${{ secrets.AZURE_REGION }}
            environment=${{ inputs.environment }}
          failOnStdErr: false

      - name: Output deployment URLs
        run: |
          echo "### Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Revision Label:** ${{ inputs.revision_label }}" >> $GITHUB_STEP_SUMMARY
          echo "**Traffic Weight:** ${{ inputs.traffic_weight }}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Active URL:** ${{ steps.deploy.outputs.activeUrl }}" >> $GITHUB_STEP_SUMMARY
          echo "**Revision URL:** ${{ steps.deploy.outputs.revisionUrl }}" >> $GITHUB_STEP_SUMMARY
          echo "**Latest Revision:** ${{ steps.deploy.outputs.latestRevisionName }}" >> $GITHUB_STEP_SUMMARY

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30
          
          ACTIVE_URL="${{ steps.deploy.outputs.activeUrl }}"
          
          # Try to reach the active URL
          for i in {1..5}; do
            if curl -f -s -o /dev/null -w "%{http_code}" "$ACTIVE_URL" | grep -q "200"; then
              echo "✅ Deployment is healthy and reachable"
              exit 0
            fi
            echo "Attempt $i/5 failed, retrying in 10s..."
            sleep 10
          done
          
          echo "⚠️ Warning: Could not verify deployment health"
          exit 1
